<!doctype html>
<html lang="ku" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <title>Kurd Drop</title>
    <!-- Critical boot styles: never leave a blank white page before JS/CSS load -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #040812 !important;
        color: #e2e8f0;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background: #040812;
      }
      #kd-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #040812;
        font-family: Vazirmatn, "Noto Sans Arabic", system-ui, sans-serif;
        direction: rtl;
        pointer-events: none;
      }
      #kd-boot[hidden] { display: none !important; }
      #kd-boot .kd-boot-icon { font-size: 42px; line-height: 1; }
      #kd-boot .kd-boot-text {
        color: #00f0ff;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.02em;
      }
      #kd-boot-error {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        padding: 24px;
        background: #040812;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
        direction: rtl;
        overflow: auto;
      }
      #kd-boot-error.is-on { display: block; }
      #kd-boot-error h1 { color: #f87171; font-size: 18px; margin: 0 0 12px; }
      #kd-boot-error pre {
        white-space: pre-wrap;
        font-size: 12px;
        color: #cbd5e1;
        direction: ltr;
        text-align: left;
      }
      #kd-boot-error button {
        margin-top: 16px;
        padding: 10px 14px;
        font-weight: 800;
        cursor: pointer;
        border-radius: 10px;
        border: 1px solid rgba(248,113,113,0.5);
        background: linear-gradient(135deg, #ef4444, #b91c1c);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="kd-boot" aria-live="polite">
      <div class="kd-boot-icon" aria-hidden="true">🎮</div>
      <div class="kd-boot-text">بارکردن...</div>
    </div>
    <div id="kd-boot-error" role="alert" hidden aria-hidden="true">
      <h1>یارییەکە نەکرایەوە</h1>
      <p style="color:#94a3b8;font-size:13px;margin:0 0 10px;">هەڵەیەک لە بارکردندا ڕوویدا. دووبارە هەوڵبدەوە.</p>
      <pre id="kd-boot-error-msg"></pre>
      <button type="button" id="kd-boot-reload">دووبارە بارکردنەوە</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
